[project]
name = "bnr-non-equilibrium-2026"
version = "0.1.0"
description = "Non-equilibrium analysis of an NH4Cl-pulsed nitrifying batch: sensor validation, NH4 observation model, alkalinity bound, process states, oxygen and energy metrics"
readme = "README.md"
authors = [
    { name = "XingyuW", email = "xingyu-wang@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "ruptures>=1.1.10",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
bnr-neq = "bnr_neq.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["bnr_neq"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
