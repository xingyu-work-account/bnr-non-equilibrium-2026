# Experimental facts confirmed by the experimenter (implementation_prompt.md, Sections 3 and 5).
# TOML has no null: a value that has not been measured is omitted, and its key is listed under [missing].

[vessel]
volume_L = 0.100
open_to_air = true
stirring = "magnetic"

[pulses]
salt = "NH4Cl"
mass_mg = 25.0
molar_mass_g_mol = 53.491
times_d = [8.53, 10.57, 24.59, 32.39]

[sensors]
ec_slope_mS_cm_per_A = -2.89855
ec_intercept_mS_cm = 0.520870
nh4_unit = "mg NH4+/L"
nh4_to_N_factor = 0.77649
orp_working = "Pt"
orp_reference = "bare Ag"

[scenarios]
temperature_C = [20.0, 25.0]          # labeled scenarios until temperature is measured
baseline_chloride_mM = [1.0, 3.0, 8.0, 13.5]
pCO2_air_atm = 4.2e-4
# W8: open-surface evaporation, a SCENARIO until vessel_mass_start_g / vessel_mass_end_g are measured.
# 0.0 is the closed-frame assumption used by every earlier milestone.
evaporation_mL_per_d = [0.0, 0.25, 0.5, 1.0]
# W2: CO2 surface transfer coefficient, a SCENARIO range (not measured, not a literature value).
kLa_CO2_per_d = [1.0, 10.0, 100.0]
# W4: O2 transfer coefficient of the stirred open vessel, a SCENARIO range until kLa_per_d is measured (not a literature
# value); it spans the lower bound required by the inverted oxygen demand (about 1 to 4 1/d) up to 100 1/d.
kLa_O2_per_d = [1.0, 10.0, 100.0]
# W4: field (process-water) aeration efficiency AE, kg O2 transferred per kWh of blower or aerator energy, a SCENARIO
# range that converts the oxygen demand into an aeration-equivalent energy of a full-scale BNR plant. Not a property of
# this vessel. The key keeps the prompt's name "SAE", but the values are process-water AE at about 2 mg/L DO, not the
# clean-water standard SAE (fine-pore diffusers: 3.6-4.8 kg O2/kWh clean water, 0.7-2.6 in process water); the metric
# names in pulses.csv therefore carry the suffix AE. The source warns that its table "should not be used as a general
# guide line and not for design" (Stenstrom and Rosso 2010, p. 55): a SCENARIO range only. The supply-based energy
# divides a transfer capacity at DO = 0 by these AE values defined at DO = 2 mg/L (stated in pulses.csv and the report).
sae_field_kgO2_per_kWh = [0.3, 1.0, 2.6]
sae_source = "Stenstrom M.K. and Rosso D. (2010) Aeration, lecture notes, UCLA and UC Irvine, 8 Feb 2010, slide 'Efficiency' (p. 56): process-water AE at 2 mg/L DO from 0.3-0.7 kg O2/kWh (coarse bubble, low SRT) to 2.0-2.6 (fine pore, high SRT); range 0.3 to 2.6 = the extremes of that table. Cross-check: Moore L.W. (2021) Biological Wastewater Treatment Training Series no. 11, Aeration Systems, Oak Ridge National Laboratory (references Metcalf & Eddy, 4th ed.): field 1.0-2.3 lb O2/(hp h) = 0.61-1.40 kg O2/kWh at alpha 0.84, DO 2 mg/L"

[scenarios.coexistence]
# Documented SCENARIO for the coexistence affinity (implementation_prompt.md, M4 item 2), not measurements.
nh4_mgN_L = 40.0
no3_mgN_L = 100.0
DO_mg_L = 0.1
pH = 7.0
temperature_C = 25.0
DO_sensitivity_mg_L = [0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 8.0]

[missing]
keys = ["temperature_C_measured", "alkalinity_mmol_L", "DO_mg_L", "kLa_per_d",
        "stirrer_power_W", "chloride_mmol_L", "orp_reference_offset_V",
        "lab_NH4_N_mg_L", "NO3_N_mg_L", "NO2_N_mg_L", "electrode_step_response",
        "vessel_mass_start_g", "vessel_mass_end_g", "covered", "top_up_mL", "initial_alkalinity_meq_L"]
# Optional (W8 / W2): once measured, move a key from [missing] to a [measurements] table, for example
# vessel_mass_start_g = 152.3 (vessel + liquid at the start), vessel_mass_end_g = 148.1, covered = false,
# top_up_mL = 0.0 (total water added), initial_alkalinity_meq_L = 4.2.
